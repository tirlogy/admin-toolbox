name: CI

on:
  push:
    branches: [main, build]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: Lint, build, test, publish
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.line }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AdminToolbox.sln
      - name: Lint (dotnet format)
        run: dotnet format AdminToolbox.sln --verify-no-changes --no-restore --verbosity minimal
      - name: Build and typecheck (nullable, warnings as errors)
        run: dotnet build AdminToolbox.sln -c Release --no-restore
      - name: Test with coverage gate (>= 80 % lines)
        run: dotnet test AdminToolbox.sln -c Release --no-build -p:CollectCoverage=true
      - name: Coverage summary
        id: coverage
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET, glob
          covered = valid = 0
          for f in glob.glob('tests/*/coverage.cobertura.xml'):
              r = ET.parse(f).getroot()
              covered += int(r.get('lines-covered')); valid += int(r.get('lines-valid'))
          print(f"line={100 * covered / valid:.1f}")
          PY
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          grep line= "$GITHUB_OUTPUT" | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tests/*/coverage.cobertura.xml
      - name: Publish Blazor WebAssembly (trimmed, Brotli)
        run: dotnet publish src/AdminToolbox.Web/AdminToolbox.Web.csproj -c Release -o publish
      - name: Bundle size
        run: |
          {
            echo "### Bundle size (_framework, Brotli)"
            echo '```'
            find publish/wwwroot/_framework -name '*.br' -printf '%s\t%f\n' | sort -rn | head -15
            find publish/wwwroot/_framework -name '*.br' -printf '%s\n' | awk '{s+=$1} END {printf "total: %.0f KB\n", s/1024}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: publish/wwwroot
          include-hidden-files: true

  e2e:
    name: E2E (Playwright)
    needs: dotnet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: publish/wwwroot
      - run: npm ci
      - name: Typecheck tests
        run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse (mobile)
    needs: dotnet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: publish/wwwroot
      - run: npm ci
      - name: Lighthouse CI
        run: npx lhci autorun
      - name: Scores
        if: always()
        run: |
          echo "### Lighthouse (median of 3 runs, mobile)" >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const fs=require('fs');const m=JSON.parse(fs.readFileSync('.lighthouseci/manifest.json','utf8'));
            for (const r of m.filter(x=>x.isRepresentativeRun)) {
              const s=Object.entries(r.summary).map(([k,v])=>k+' '+Math.round(v*100)).join(', ');
              console.log('- '+r.url+': '+s);
            }" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: e2e/.lighthouseci
          include-hidden-files: true

  badges:
    name: Coverage badge
    needs: [dotnet, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/build' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish coverage.json to the badges branch
        env:
          COVERAGE: ${{ needs.dotnet.outputs.coverage }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges:refs/remotes/origin/badges || true
          git switch badges 2>/dev/null || git switch --orphan badges
          git rm -rq . 2>/dev/null || true
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"brightgreen\"}" > coverage.json
          git add coverage.json
          git commit -m "chore: coverage ${COVERAGE}%" || exit 0
          git push origin badges

  deploy-preview:
    name: Deploy preview (Cloudflare Pages)
    needs: [e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/build'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: publish/wwwroot
      - name: Deploy to the preview branch alias
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping deploy (see OFFEN.md)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy publish/wwwroot --project-name admin-toolbox --branch build --commit-dirty=true
