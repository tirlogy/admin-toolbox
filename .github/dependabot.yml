version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspnetcore:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.Extensions.*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 (native compiler) and Node type majors are adopted deliberately, not by bot.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
